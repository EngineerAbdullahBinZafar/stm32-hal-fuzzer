name: CI — Quality & Tests (C11 Fuzz Harness & Python)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  c11-fuzz-harness:
    name: ⚙️ C11 HAL Invariants & Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC & Make
        run: sudo apt-get update && sudo apt-get install -y gcc make

      - name: Compile & Execute STM32 HAL C11 Fuzz Suite
        run: make test

  lint:
    name: 🐍 Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install flake8
      - run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  test:
    name: 🧪 Run Python Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pyserial
      - name: Run Python Tests
        run: python -m pytest test/ -v --tb=short
